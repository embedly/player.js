name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Future jobs (lint, build) go alongside this one; each shows up as its own
  # "CI / <name>" check for branch protection.
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: the legacy Grunt toolchain pulls in phantomjs, whose
      # install script downloads a binary that no longer exists. Nothing the
      # tests use needs install scripts.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The suite uses the real Chrome channel (H.264 playback), which is
      # preinstalled on GitHub's Ubuntu runners.
      - name: Chrome version
        run: google-chrome --version

      - name: Run tests
        run: npm test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
