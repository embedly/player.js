<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>player.js HTML5 receiver</title>
</head>
<body>
  <video id="video" width="320" height="180"></video>
  <script src="/player.js"></script>
  <script>
    var video = document.getElementById('video');
    var adapter = window.adapter = playerjs.HTML5Adapter(video);

    // ?early=1 mirrors the original test page: ready immediately, before any
    // media metadata exists. Otherwise wait for metadata like a real
    // integration should.
    if (new URLSearchParams(location.search).get('early')) {
      video.preload = 'none';
      video.src = '/lib/videos/demo.mp4';
      adapter.ready();
    } else {
      video.preload = 'auto';
      video.addEventListener('loadedmetadata', function () { adapter.ready(); }, { once: true });
      video.src = '/lib/videos/demo.mp4';
    }
  </script>
</body>
</html>
